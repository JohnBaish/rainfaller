<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Rainfaller – rainfall near you today</title>
    <meta name="description" content="How much rain has fallen nearby, so far today? Rain in the last hour and so far today at the nearest Environment Agency gauges in England, free." />
    <link rel="canonical" href="https://rainfaller.baish.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rainfaller.baish.net/" />
    <meta property="og:title" content="Rainfaller" />
    <meta property="og:description" content="How much rain has fallen nearby, so far today?" />
    <meta property="og:image" content="https://rainfaller.baish.net/og-rainfaller.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rainfaller" />
    <meta name="twitter:description" content="How much rain has fallen nearby, so far today?" />
    <meta name="twitter:image" content="https://rainfaller.baish.net/og-rainfaller.png" />
    <!-- The search title and description are drafts for John (stage 5). The link-preview tags
         point at the final address, so previews only work once rainfaller.baish.net is live. -->
    <!-- Dark mode: set before the page draws, so there's no flash of the wrong colours. A
         choice kept by the switch wins; otherwise the device's own setting (HOUSE-STYLE §2).
         The same key and rule as src/lib/theme.ts. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('rainfaller.theme') } catch (e) {}
        var device = false
        try { device = window.matchMedia('(prefers-color-scheme: dark)').matches } catch (e) {}
        if (t === 'dark' || (t !== 'light' && device)) document.documentElement.dataset.theme = 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
