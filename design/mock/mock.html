<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rainfaller mock-up</title>
<!-- Stage 1 mock-up (PLAN.md). Design only: real Environment Agency readings, fetched once
     and written in below by make-mock.py. Hindcaster's stylesheets are copied beside it so
     the look matches; Rainfaller's own additions are in the <style> block.
     Address options: ?screen=chooser, ?state=edge (illustrations of a late gauge, a failed
     gauge and a gauge without enough days), ?theme=dark. -->
<link rel="stylesheet" href="organic.css">
<link rel="stylesheet" href="global.css">
<style>
  .place-strip { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
  .fresh { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; margin: var(--space-4) 0; }
  .fresh p { margin: 0; }
  .rf-table td.num { white-space: nowrap; }
  .rf-today .big { font-size: 20px; }
  .rf-today .note { margin-top: 4px; }
  .rf-late { color: var(--color-neutral-700); }
  .rf-late .big { font-weight: 400; }
  .rf-cards { display: none; flex-direction: column; gap: var(--space-4); }
  .rf-card { padding: var(--space-4); box-shadow: var(--shadow-sm); }
  .rf-card h4 { margin: 0; font-size: 18px; }
  .rf-card .row { display: grid; grid-template-columns: 92px 1fr; gap: var(--space-3); padding: 6px 0; border-top: 1px solid var(--color-divider); }
  .rf-card .row:first-of-type { border-top: 0; margin-top: var(--space-2); }
  .rf-card .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-neutral-700); padding-top: 4px; }
  .recent { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .recent-btn { display: inline-flex; align-items: stretch; border: 1px solid var(--color-divider); border-radius: 999px; overflow: hidden; }
  .recent-btn button { background: none; border: 0; font: inherit; color: var(--color-text); cursor: pointer; padding: 8px 12px; min-height: 40px; }
  .recent-btn .x { color: var(--color-neutral-700); padding: 8px 12px 8px 4px; }
  .illus { margin: var(--space-4) 0 0; padding: var(--space-2) var(--space-3); border: 1px dashed var(--color-accent); border-radius: var(--radius-sm); }
  /* Colour by state (HOUSE-STYLE §2; John, November 17th 2026): in dark mode, each gauge
     edged blue when today is wetter than its fortnight's average by this time, sand when
     drier, none when the same, without an average or failed. The figures still say it. */
  @media screen {
    :root[data-theme="dark"] .rf-wetter { --rf-edge: #6a98c6; }
    :root[data-theme="dark"] .rf-drier { --rf-edge: #d8b46e; }
    :root[data-theme="dark"] .rf-card:is(.rf-wetter, .rf-drier) { box-shadow: inset 5px 0 0 var(--rf-edge), 0 0 0 1px color-mix(in srgb, #e8dfcf 8%, transparent), 0 4px 14px #0009; }
    :root[data-theme="dark"] tr:is(.rf-wetter, .rf-drier) td:first-child { box-shadow: inset 5px 0 0 var(--rf-edge); padding-left: 20px; }
  }
  @media (max-width: 720px) {
    .rf-table { display: none; }
    .rf-cards { display: flex; }
    .recent-btn button { min-height: 44px; }
    .fresh .btn { min-height: 44px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = {"code": "RG4", "place": "Caversham", "cut": "9.15am", "checked": "9.47am", "rows": [{"name": "University of Reading", "line": "near Earley, Wokingham", "miles": 3.1834754627007693, "dir": "south-east", "hour": 0.0, "today": 12.97, "yesterday": 0.0, "avg": 0.63, "days": 14}, {"name": "Cleeve", "line": "near Goring, Oxfordshire", "miles": 7.906372392805079, "dir": "north-west", "hour": 0.07, "today": 9.38, "yesterday": 0.04, "avg": 0.66, "days": 14}, {"name": "Bracknell", "line": "Bracknell Forest", "miles": 9.233123822493951, "dir": "east", "hour": 0.0, "today": 12.32, "yesterday": 0.01, "avg": 0.62, "days": 14}, {"name": "Yattendon", "line": "West Berkshire", "miles": 9.87686202307673, "dir": "west", "hour": 0.35, "today": 8.89, "yesterday": 0.0, "avg": 0.59, "days": 14}, {"name": "Benson", "line": "Oxfordshire", "miles": 11.180558282143627, "dir": "north-west", "hour": 0.07, "today": 8.18, "yesterday": 0.07, "avg": 0.5, "days": 14}, {"name": "Stokenchurch", "line": "Buckinghamshire", "miles": 12.960707134661709, "dir": "north", "hour": 0.05, "today": 11.32, "yesterday": 0.07, "avg": 0.4, "days": 14}, {"name": "Basingstoke", "line": "Hampshire", "miles": 13.496006582378914, "dir": "south", "hour": 0.0, "today": 13.67, "yesterday": 0.0, "avg": 0.53, "days": 14}, {"name": "Camberley", "line": "Surrey", "miles": 13.819144679520091, "dir": "south-east", "hour": 0.0, "today": 12.84, "yesterday": 0.01, "avg": 0.67, "days": 14}, {"name": "Kingsclere", "line": "Hampshire", "miles": 15.085400466305261, "dir": "south-west", "hour": 0.01, "today": 8.52, "yesterday": 0.0, "avg": 0.44, "days": 14}, {"name": "Chieveley", "line": "West Berkshire", "miles": 15.428093352648686, "dir": "west", "hour": 0.18, "today": 10.62, "yesterday": 0.0, "avg": 0.55, "days": 14}, {"name": "West Ilsley", "line": "West Berkshire", "miles": 16.641764851820042, "dir": "west", "hour": 0.02, "today": 6.53, "yesterday": 0.0, "avg": 0.44, "days": 14}, {"name": "Ham Island", "line": "near Sunnymeads, Windsor and Maidenhead", "miles": 17.239012531321357, "dir": "east", "hour": 0.01, "today": 14.96, "yesterday": 0.01, "avg": 0.39, "days": 14}, {"name": "Prestwood", "line": "near Great Hampden, Buckinghamshire", "miles": 17.85469107978084, "dir": "north-east", "hour": 0.2, "today": 12.6, "yesterday": 0.0, "avg": 0.23, "days": 14}, {"name": "Abingdon", "line": "near Caldecott, Oxfordshire", "miles": 18.090466698111697, "dir": "north-west", "hour": 0.69, "today": 9.49, "yesterday": 0.02, "avg": 0.51, "days": 14}], "recent": ["RG4 · Caversham", "BN1 · Brighton", "EX1 · Exeter"], "credits": ["Contains OS data © Crown Copyright and database rights 2026.", "Contains Royal Mail data © Royal Mail copyright and database right 2026.", "Contains National Statistics data © Crown copyright and database right 2026"]};
const q = new URLSearchParams(location.search);
if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
const screen = q.get('screen') || 'place';
const edge = q.get('state') === 'edge';

// One decimal, halves away from zero, worked in whole hundredths (as Hindcaster's format.ts).
const one = (v) => { const h = Math.round(Math.abs(v) * 100); const t = Math.round(h / 10); return (v < 0 && t ? '−' : '') + (t / 10).toFixed(1); };
const mm = (v) => one(v) + ' mm';
const miles = (m) => { const w = Math.round(m); return w < 1 ? 'less than 1 mile' : w === 1 ? '1 mile' : w + ' miles'; };
const words = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
const n = (k) => (k < 10 ? words[k] : String(k));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const rows = DATA.rows.slice(0, 8).map((r) => ({ ...r }));
if (edge) {
  // Illustrations only: not what the gauges really did.
  rows[3] = { ...rows[3], late: '7.45am', hour: null };
  rows[5] = { ...rows[5], failed: true };
  rows[6] = { ...rows[6], avg: null, days: 8 };
  rows[7] = { ...rows[7], today: 0.3, hour: 0 };
}
const ok = rows.filter((r) => !r.failed);
const most = Math.max(...ok.map((r) => r.today));
const wetHour = ok.filter((r) => r.hour !== null && Math.round(r.hour * 10) / 10 > 0);
const upHour = Math.max(0, ...ok.map((r) => r.hour ?? 0));
const lo = Math.min(...ok.map((r) => r.today)), hi = Math.max(...ok.map((r) => r.today));
const above = ok.filter((r) => r.avg !== null && r.today > r.avg).length;
const withAvg = ok.filter((r) => r.avg !== null).length;

// John's wording (November 17th 2026); the variants for one gauge, ties, no rain and
// gauges without an average are Claude's drafts in the same pattern.
const cap = (s) => s[0].toUpperCase() + s.slice(1);
const list = (xs) => (xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1]);
function summary() {
  const of = (k) => (k === ok.length ? `all ${n(k)}` : `${n(k)} of the ${n(ok.length)}`);
  const top = one(upHour);
  const topNames = wetHour.filter((r) => one(r.hour) === top).map((r) => esc(r.name));
  const hourLine = wetHour.length === 0
    ? `There was no rain in the last hour at any of the ${n(ok.length)} gauges.`
    : wetHour.length === 1
      ? `There was rain in the last hour at one of the ${n(ok.length)} gauges, ${topNames[0]}, recording ${top} mm.`
      : `There was rain in the last hour at ${of(wetHour.length)} gauges, the highest of them, at ${list(topNames)}, recording ${top} mm.`;
  const todayLine = hi === 0
    ? `None of the ${n(ok.length)} gauges has recorded any rain so far today.`
    : `The range of rainfall recorded so far today is ${one(lo)} to ${mm(hi)}.`;
  const among = withAvg === ok.length ? `${n(ok.length)}` : `${n(withAvg)} gauges with an average`;
  const aboveLine = above === withAvg
    ? `All ${withAvg === ok.length ? n(ok.length) + ' gauges' : among} had recorded more than the fortnight's average by this time.`
    : above === 0
      ? `None of the ${among}${withAvg === ok.length ? ' gauges' : ''} had recorded more than the fortnight's average by this time.`
      : `${cap(n(above))} of the ${among}${withAvg === ok.length ? ' gauges' : ''} had recorded more than the fortnight's average by this time.`;
  return `<p>${hourLine}</p><p>${todayLine} ${aboveLine}</p>`;
}

function todayCell(r) {
  if (r.failed) return `<span class="muted">Couldn't get this gauge's readings. Press Refresh to try again.</span>`;
  const bar = `<div class="bar" style="width:${Math.max(2, (r.today / most) * 100)}%"></div>`;
  const avg = r.avg === null ? `Not enough readings for an average` : `Fortnight average by ${DATA.cut}: ${mm(r.avg)}`;
  const y = r.yesterday === null ? '' : `<div class="note">By ${DATA.cut} yesterday: ${mm(r.yesterday)}</div>`;
  const late = r.late ? `<div class="note">Latest reading ${r.late}</div>` : '';
  return `<div class="${r.late ? 'rf-late' : ''}"><span class="big mono">${mm(r.today)}</span>${bar}${late}<div class="note">${avg}</div>${y}</div>`;
}
const state = (r) => (r.failed || r.avg === null ? '' : Number(one(r.today)) > Number(one(r.avg)) ? 'rf-wetter' : Number(one(r.today)) < Number(one(r.avg)) ? 'rf-drier' : '');
const hourCell = (r) => (r.failed ? '' : r.late ? `<span class="muted">Not available</span>` : `<span class="mono">${mm(r.hour)}</span>`);

function table() {
  return `<table class="table figures rf-table">
    <colgroup><col style="width:34%"><col style="width:16%"><col style="width:14%"><col style="width:36%"></colgroup>
    <thead><tr><th>Gauge</th><th>Distance</th><th>Last hour</th><th>Today</th></tr></thead>
    <tbody>${rows.map((r) => `<tr class="${state(r)}">
      <td><b>${esc(r.name)}</b>${r.line ? `<div class="note">${esc(r.line)}</div>` : ''}</td>
      <td class="mono">${miles(r.miles)}<div class="note">${r.dir}</div></td>
      <td>${hourCell(r)}</td>
      <td class="rf-today">${todayCell(r)}</td></tr>`).join('')}</tbody></table>`;
}
function cards() {
  return `<div class="rf-cards">${rows.map((r) => `<div class="card rf-card ${state(r)}">
    <h4>${esc(r.name)}</h4>${r.line ? `<div class="note">${esc(r.line)}</div>` : ''}
    <div class="row"><span class="label">Distance</span><span>${miles(r.miles)} ${r.dir}</span></div>
    ${r.failed ? '' : `<div class="row"><span class="label">Last hour</span><span>${hourCell(r)}</span></div>`}
    <div class="row"><span class="label">Today</span><span class="rf-today">${todayCell(r)}</span></div>
  </div>`).join('')}</div>`;
}

const nav = `<div class="nav"><span class="nav-brand">Rainfaller</span><div class="nav-right">
  <button type="button" class="theme-switch" role="switch" aria-checked="${q.get('theme') === 'dark'}" aria-label="Dark mode"><span class="theme-switch-label">Dark</span><span class="theme-switch-track"><span class="theme-switch-knob">${q.get('theme') === 'dark'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'}</span></span></button>
  </div></div>`;
const footer = `<p class="footer-notice">Rainfaller is a free-to-use personal project by John Baish. Your device, rather than the website, stores your recent places and your choice of light or dark mode. To get the readings, your browser asks the Environment Agency directly. More free tools at <a class="footer-link" href="https://www.baish.net/">www.baish.net</a>.</p>`;
const credit = `<p class="data-credit">This uses Environment Agency rainfall data from the real-time data API (Beta). ${DATA.credits.join(' ')}</p>`;

const recent = DATA.recent.map((p) => `<span class="recent-btn"><button type="button">${p}</button><button type="button" class="x" aria-label="Remove ${p}">×</button></span>`).join('');

const chooser = `<div class="chooser-head"><span class="card-kicker">Rain today</span><h2>Rainfall nearby</h2></div>
  <div class="card" style="padding:var(--space-6);gap:var(--space-3)">
    <h3 style="margin:0;font-size:20px">Choose a place</h3>
    <div class="choose-row"><input class="input" placeholder="Postcode" aria-label="Postcode"><button class="btn btn-primary" type="button">Show</button></div>
    <p class="note" style="margin:0">Such as RG1 or RG1 8FR. Only the first half (RG1) is used.</p>
    <p class="muted" style="margin:var(--space-2) 0 0">Recent places</p>
    <div class="recent">${recent}</div>
  </div>
  <p class="chooser-about muted">The rain recorded so far today and in the last hour at the nearest Environment Agency rain gauges, with the fortnight's average and the total by yesterday at the same time. Readings arrive every 15 minutes. Free to use.</p>`;

const place = `<div class="card strip place-strip"><h2>${DATA.code} · ${n(rows.length)} gauges nearest to ${esc(DATA.place)}</h2><button class="btn btn-secondary" type="button">Change</button></div>
  <div class="fresh"><p class="muted">Readings to ${DATA.cut}. Checked at ${DATA.checked}.</p><button class="btn btn-secondary" type="button">Refresh</button></div>
  <div class="card roundup">${summary()}</div>
  <section class="source">
    <div class="section-head"><h3>Rain today</h3></div>
    <p class="note gauges-intro">The ${n(rows.length)} nearest Environment Agency rain gauges reporting, nearest first. Today is from midnight.</p>
    ${table()}${cards()}${credit}
  </section>
  ${edge ? `<p class="illus note"><b>Illustration only:</b> ${esc(rows[3].name)} shown as late, ${esc(rows[5].name)} as failed, ${esc(rows[6].name)} without enough days for an average, and ${esc(rows[7].name)} as drier than its fortnight's average. The other figures are real.</p>` : ''}`;

document.getElementById('app').innerHTML = nav + `<div class="col screen">${screen === 'chooser' ? chooser : place}${footer}</div>`;
</script>
</body>
</html>
